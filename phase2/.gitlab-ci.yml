stages: [test, build, deploy, verify]
variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  OPENSHIFT_PROJECT: "gitlab-platform"
  APPLICATION_NAME: "webhook-dashboard"
test:
  stage: test
  image: python:3.12
  script:
    - pip install -r app/requirements.txt
    - python -m py_compile app/app.py
build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -f app/Containerfile -t "$IMAGE_TAG" app
    - docker push "$IMAGE_TAG"
deploy:
  stage: deploy
  image: quay.io/openshift/origin-cli:latest
  script:
    - oc login "$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN"
    - oc project "$OPENSHIFT_PROJECT"
    - sed "s|__APPLICATION_IMAGE__|$IMAGE_TAG|g; s|__APPLICATION_NAME__|$APPLICATION_NAME|g" openshift/deployment.yaml | oc apply -f -
    - for f in service route hpa networkpolicy; do sed "s|__APPLICATION_NAME__|$APPLICATION_NAME|g" openshift/$f.yaml | oc apply -f -; done
    - oc rollout status "deployment/$APPLICATION_NAME" --timeout=5m
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
verify:
  stage: verify
  image: quay.io/openshift/origin-cli:latest
  script:
    - oc login "$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN"
    - oc get all -n "$OPENSHIFT_PROJECT"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
