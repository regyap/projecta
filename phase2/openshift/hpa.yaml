apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: __APPLICATION_NAME__}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: __APPLICATION_NAME__}
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 65}
