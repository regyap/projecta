apiVersion: apps/v1
kind: Deployment
metadata:
  name: __APPLICATION_NAME__
spec:
  replicas: 2
  selector:
    matchLabels:
      app: __APPLICATION_NAME__
  template:
    metadata:
      labels:
        app: __APPLICATION_NAME__
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: __APPLICATION_IMAGE__
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: true
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: runtime-tmp
          mountPath: /tmp
      automountServiceAccountToken: false
      volumes:
      - name: runtime-tmp
        emptyDir:
          sizeLimit: 64Mi
