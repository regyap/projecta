name: Architecture checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r phase2/app/requirements.txt boto3 PyYAML ansible-core kubernetes
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - run: |
          ansible-playbook ansible/container-baseline.yml --syntax-check
          ansible-playbook ansible/container-baseline.yml
          ansible-playbook ansible/ldap-config.yml
          ruby -c .rendered/gitlab-ldap.rb
      - name: Check rendered baseline and SDK request contract
        run: |
          python - <<'PY'
          import yaml, boto3
          from botocore.validate import validate_parameters
          with open('.rendered/container-patch.yaml') as f: patch=yaml.safe_load(f)
          assert patch['spec']['template']['spec']['containers'][0]['securityContext']['readOnlyRootFilesystem'] is True
          client=boto3.client('geo-places', region_name='ap-southeast-1', aws_access_key_id='test', aws_secret_access_key='test')
          validate_parameters({'QueryPosition':[103.8,1.3], 'MaxResults':1, 'IntendedUse':'Storage'}, client.meta.service_model.operation_model('ReverseGeocode').input_shape)
          PY
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run with OpenShift-like restricted settings
        run: |
          docker build -f phase2/app/Containerfile -t projecta-smoke phase2/app
          docker run -d --name smoke --read-only --user 100123:0 --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=64m -p 127.0.0.1:8080:8080 projecta-smoke
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | python -c 'import json,sys; assert json.load(sys.stdin)["application"] == "webhook-dashboard"'
      - if: always()
        run: docker logs smoke || true
